import dev.vankka.dependencydownload.task.GenerateDependencyDownloadResourceTask

[
        'net.kyori',
].each {
    tasks.shadowJar.relocate it, 'com.discordsrv.dependencies.' + it
    tasks.generateRuntimeDownloadResourceForRuntimeDownloadOnly.relocate it, 'com.discordsrv.dependencies.' + it
}
// More relocations in buildscript/relocations.gradle

apply from: rootProject.file('buildscript/runtime.gradle')

allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven { url = 'https://repo.papermc.io/repository/maven-public/' }
            }
            filter {
                includeGroup 'net.md-5'
            }
        }
    }

    dependencies {
        // Platform
        compileOnly(libs.bungee)
    }
}

var generateResourceForAdventure = tasks.register('generateResourceForAdventure', GenerateDependencyDownloadResourceTask) {
    var conf = configurations.runtimeDownloadApi
    configuration = conf
    file = 'dependencies/adventureApi.txt'
}

processResources {
    dependsOn(generateResourceForAdventure)
}

shadowJar {
    archiveFileName = 'bungee.jarinjar'
}

dependencies {
    // API
    annotationProcessor project(':api')

    // Common
    implementation project(':common')

    // DependencyDownload
    implementation(libs.mcdependencydownload.bungee.bootstrap)

    // FastStats Metrics
    implementation(libs.faststats.bungeecord)

    // Adventure
    runtimeDownloadApi(libs.adventure.api)
}
