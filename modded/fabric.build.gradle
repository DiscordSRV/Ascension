plugins {
    id("dev.kikugie.stonecutter") version "0.10-alpha.10"
    id("dev.kikugie.loom-back-compat") version "0.4.2"
    id("dev.kikugie.fletching-table") version "0.2.0-alpha.9"
}
apply from: rootProject.file('buildscript/standalone.gradle')

configurations.configureEach {
    resolutionStrategy {
        force "org.slf4j:slf4j-api:1.7.36" // Introduced by Minecraft itself
        force "net.fabricmc:fabric-loader:0.14.0"
    }
}

def minecraftVersion = project.name.split('-', 2)[0]
var is1_21_11 = sc.eval(minecraftVersion, ">=1.21.11")
var is26_1 = sc.eval(minecraftVersion, ">=26.1")

sc.properties.tags(minecraftVersion, "fabric")

java {
    var java = is26_1
            ? JavaVersion.VERSION_25
            : JavaVersion.VERSION_21

    targetCompatibility = java
    sourceCompatibility = java
}

sourceSets {
    main {
        java {
            exclude "com/discordsrv/neoforge/**"
        }
    }
}

stonecutter {
    // Yarn and Parchment mappings
    replacements.string(is1_21_11) {
        replace("ResourceLocation", "Identifier")
        replace(".location()", ".identifier()")
        replace("ResourceKey::location", "ResourceKey::identifier")
    }

    // Minecraft
    replacements.string(sc.eval(minecraftVersion, ">=26.3"), "advancement_26_3") {
        replace("shouldAnnounceChat()", "announceToChat()")
        replace("display.getType()", "display.type()")
        replace("display.getTitle()", "display.title()")
        replace("display.getDescription()", "display.description()")
    }

    // Text Placeholder API
    replacements.string(is26_1, "textplaceholder") {
        replace("PlaceholderHandler", "eu.pb4.placeholders.api.Placeholder.Handler<ServerPlaceholderContext, String>")
        replace("PlaceholderContext", "ServerPlaceholderContext")
        replace("@Nullable String argument", "String argument")
        replace("ctx.player()", "ctx.serverPlayer()")
    }
    replacements.string(sc.eval(minecraftVersion, ">=26.3")) {
        replace("com.mojang.authlib.yggdrasil.ProfileResult", "com.mojang.authlib.services.ProfileResult")
    }
}

processResources {
    var replaceProperties = [
            mod_id:       "discordsrv",
            mod_name:     "DiscordSRV",
            mod_license:  "GPLv3",
            mod_version:  version,

            minecraft_version: minecraftVersion,
            minecraft_version_range: sc.properties.getOrNull("minecraft.version_range"),

            fabric_loader_version: sc.properties.getOrNull("deps.fabric_loader"),
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }

    dependsOn generateRuntimeDownloadResourceForRuntimeDownloadOnly
}

tasks.register('copyJar', Copy) {
    from is26_1 ? shadowJar : remapJar
    into rootProject.file("jars/fabric")
}

if (!is26_1) {
    remapJar {
        dependsOn shadowJar
        mustRunAfter shadowJar
        inputFile = shadowJar.archiveFile

        archiveBaseName = "DiscordSRV-Fabric-${sc.properties.getOrNull("minecraft.version_range_label")}"
        archiveClassifier = jar.archiveClassifier

        finalizedBy copyJar
    }
} else {
    shadowJar {
        // Loom modifies "fabric.mod.json" from jar task with additional data. We want those changes to be present in the final shadow jar as well.
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        from(zipTree(jar.archiveFile))

        archiveBaseName = "DiscordSRV-Fabric-${sc.properties.getOrNull("minecraft.version_range_label")}"
        archiveClassifier = jar.archiveClassifier

        finalizedBy copyJar
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    mergeServiceFiles()
}

spotless {
    java {
        if (sc.current.isActive)
            target("src/main/java/")
    }
}

tasks.named("assemble") {
    dependsOn(loomx.modJar)
}

artifacts {
    shadow shadowJar
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    installerVersion = "1.1.2"
    loaderVersion = "0.19.5"
    minecraftVersion = project.name.split('-', 2)[0]
    runDir = "../../run"

    mods.setFrom is26_1 ? shadowJar.archiveFile : remapJar.archiveFile
    mods.from configurations.modCompileOnly // Include integration mods
    mods.from configurations.modRuntimeOnly // Include integration mods

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java.targetCompatibility.getMajorVersion())
    }
}

loom {
    serverOnlyMinecraftJar()

    runs {
        remove server
    }
}

repositories {
    mavenLocal()
    def strictMaven = { String url, String alias, String... groups ->
        exclusiveContent {
            forRepository { maven { it.url = url; it.name = alias } }
            filter { groups.each { includeGroup it } }
        }
    }
    strictMaven('https://maven.nucleoid.xyz', 'Nucleoid', 'eu.pb4')
    strictMaven('https://maven.fabricmc.net/', 'FabricMC', 'net.fabricmc')
    strictMaven('https://www.cursemaven.com', 'Curseforge', 'curse.maven')
    strictMaven('https://api.modrinth.com/maven', 'Modrinth', 'maven.modrinth')
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraftVersion}")
    loomx.applyMojangMappings()

    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.2"))

    // API
    annotationProcessor project(':api')
    shadow project(':common:common-api')

    // Common
    shadow project(':common')

    runtimeDownload(libs.adventure.api)

    compileOnly("net.fabricmc:fabric-loader:${sc.properties.getOrNull("deps.fabric_loader")}")
    include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.2"))

    // Fabric API
    Set<String> apiModules = [
            'fabric-api-base',
            'fabric-lifecycle-events-v1',
            'fabric-entity-events-v1',
            'fabric-networking-api-v1',
            'fabric-message-api-v1',
            'fabric-command-api-v2',
            sc.eval(minecraftVersion, "<1.21.9") ? 'fabric-resource-loader-v0' : 'fabric-resource-loader-v1'
    ]
    apiModules.forEach {
        modImplementation(fabricApi.module(it, sc.properties.getOrNull("deps.fabric_api")))
    }

    include(modImplementation("me.lucko:fabric-permissions-api:${sc.properties.getOrNull("deps.fabric_permission_api")}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api-base'
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api-bom'
    })

    // Integrations
    modCompileOnly("eu.pb4:placeholder-api:${sc.properties.getOrNull("deps.text_placeholder_api")}")

    // Used to run the production server
    modRuntimeOnly fletchingTable.modrinthBundle('fabric-api') // Included by modImplementation
    modRuntimeOnly fletchingTable.modrinthBundle('carbon') // Included by :common
    modRuntimeOnly fletchingTable.modrinthBundle('luckperms') // Included by :common

    // DependencyDownload
    shadow(libs.mcdependencydownload.fabric) {
        exclude module: 'fabric-loader'
    }
}
